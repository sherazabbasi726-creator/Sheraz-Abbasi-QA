<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earthworks QA – Engr Muhammad Sheraz Abbasi</title>
<meta name="description" content="Earthwork grading QA app (cut & fill, WIRs, levels, 3D, daily reports) — Engr Muhammad Sheraz Abbasi">
<meta name="author" content="Engr Muhammad Sheraz Abbasi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sheraz QA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171a;--panel:#1c2024;--panel2:#242a2f;--line:#323a41;--txt:#e8e6e1;--mut:#9aa3aa;
  --acc:#f2a93b;--acc2:#4fb3a5;--ok:#6cc487;--warn:#f2a93b;--bad:#e5645f;--info:#7aa2f7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="corp"]{--bg:#eef2f7;--panel:#fff;--panel2:#e4eaf2;--line:#d3dce8;--txt:#14243a;--mut:#5d6f86;--acc:#0b5cad;--acc2:#0e8f8a;--ok:#1f8f4e;--warn:#c76a00;--bad:#c4372f;--info:#0b5cad}
:root[data-theme="corp"] header{background:#0b2a4a;color:#fff;border-bottom:3px solid #0e8f8a}
:root[data-theme="corp"] header h1 small,:root[data-theme="corp"] #stat{color:#a9c1dc}
:root[data-theme="exec"]{--bg:#0a111d;--panel:#111c2e;--panel2:#18273d;--line:#243650;--txt:#e9eef6;--mut:#8fa2bb;--acc:#d9a441;--acc2:#4cc3b5;--ok:#58c487;--warn:#e0a13a;--bad:#e5645f;--info:#7fb0ff}
:root[data-theme="exec"] header{background:#0d1626;border-bottom:2px solid #d9a441}
:root[data-theme="clean"]{--bg:#ffffff;--panel:#f5f7f9;--panel2:#e9edf1;--line:#dde3e9;--txt:#1b2630;--mut:#6a7886;--acc:#0f7b6c;--acc2:#2a6fdb;--ok:#2a8a4b;--warn:#b86e00;--bad:#c23b36;--info:#2a6fdb}
:root[data-theme="clean"] header{background:#fff;border-bottom:1px solid #dde3e9}
:root[data-theme="corp"],:root[data-theme="clean"]{color-scheme:light}
:root[data-theme="exec"],:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .hico{width:30px;height:30px;border-radius:8px;flex:none;object-fit:cover;background:#0f2c52}
header h1{font-size:16px;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{opacity:.75;font-weight:400;margin-left:6px;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
#stat{font-size:12px;color:var(--mut)}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow:auto;padding:14px 16px 52px;display:none;-webkit-overflow-scrolling:touch}
.tab.on{display:block}
.tab.fill{padding:0;overflow:hidden}
.tab>*{max-width:920px;margin-left:auto;margin-right:auto}
.tab.fill>*{max-width:none}
nav{display:flex;gap:2px;padding:8px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.10);justify-content:center}
nav button{flex:1;min-width:0;max-width:110px;background:none;border:0;color:var(--mut);padding:2px 0 3px;font:600 10.5px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent}
nav button .ni{display:flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:14px}
nav button .ni svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button.on .ni{background:color-mix(in srgb,var(--acc) 20%,transparent)}
nav button.big{margin-top:-24px;flex:none;width:96px}
nav button.big .ni{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 5px var(--panel)}
nav button.big .ni svg{width:29px;height:29px;stroke-width:2.1}
nav button.big:active .ni{transform:scale(.94)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 8px;font-weight:700}
h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.grid .card{margin:0}
.stat .v{font:600 24px var(--mono);line-height:1.1}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}.mono{font-family:var(--mono)}
.ur{color:var(--acc2);font-size:12px;font-style:italic}
.badge{display:inline-block;font:600 11px system-ui;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.b-prior{color:var(--mut)}.b-approved{color:var(--ok)}.b-approved_open{color:var(--warn)}.b-rejected{color:var(--bad)}.b-pending{color:var(--info)}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 13px system-ui;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .btn.pri,:root[data-theme="exec"] .btn.pri{color:#1a1200}
.btn.dng{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.on{outline:2px solid var(--acc)}
.btn:disabled{opacity:.5}
input,select,textarea{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--acc)}
textarea{width:100%;min-height:80px;font-family:var(--mono);font-size:13px}
label.f{display:block;margin-bottom:10px;font-size:12px;color:var(--mut)}
label.f>input:not([type=checkbox]),label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;color:var(--txt);font-size:15px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0}
.bar>i{display:block;height:100%;background:var(--acc2)}
.bar.cut>i{background:var(--bad)}.bar.fill>i{background:var(--info)}
.item{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.item.done span{text-decoration:line-through;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.warn{border-left:4px solid var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right;font-family:var(--mono)}
td input{min-width:60px;padding:4px 6px}
.tbl{overflow-x:auto}
.lnk{background:none;border:0;color:var(--info);font:inherit;font-weight:700;padding:0;cursor:pointer;text-decoration:underline}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:520px}
.modal h2{margin-top:0;font-size:15px;text-transform:none;letter-spacing:0;color:var(--txt)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;z-index:200;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);max-width:90%}
/* home */
.hero{background:linear-gradient(135deg,#0b2a4a,#123e6b 60%,#0e8f8a);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 6px 18px rgba(11,42,74,.25)}
:root[data-theme="exec"] .hero{background:linear-gradient(135deg,#111c2e,#1d2f4b 60%,#5a4417)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1c2024,#2a3036 60%,#6b4a12)}
.hero .htop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero .hn{font-weight:800;font-size:20px;line-height:1.1}
.hero .hsub{font-size:12px;opacity:.8;margin-top:3px}
.hero .hasof{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.hero .hdot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.hero .hwrap{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.hero .hs{flex:1 1 260px;min-height:170px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.18);position:relative}
.hero .hs canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
.hero .kpis{flex:1 1 200px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .kpi{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.hero .kpi b{font:800 20px var(--mono)}
.hero .kpi span{font-size:11px;opacity:.85}
.hero .hby{font-size:11px;opacity:.75;margin-top:8px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--txt);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px;font:inherit}
.tile .tt{display:flex;justify-content:space-between;align-items:flex-start}
.tile .ti{font-size:28px;line-height:1;color:var(--acc)}
.tile .tf{font:800 18px var(--mono);color:var(--acc2)}
.tile b{font-size:16px}
.tile small{color:var(--mut);font-size:12px}
.tile.warn{border-left:4px solid var(--warn)}
.tiles.simple{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tile .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.tile .dh b{font-size:16px}
.drow{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;padding:4px 0}
.drow i{width:10px;height:10px;border-radius:3px}
.drow .dl{font-size:13px}
.drow b{font:700 16px var(--mono)}
.drow b small{font-size:11px;color:var(--mut)}
.drow .ds{grid-column:2/4;font-size:11px;color:var(--mut)}
.dwk{margin-top:8px}
.dbars{display:flex;gap:4px;align-items:flex-end;height:70px}
.dbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dbar i{width:100%;background:var(--info);border-radius:3px 3px 0 0;display:block}
.dbar small{font-size:9px;color:var(--mut);white-space:nowrap}
.dcap{font-size:11px;color:var(--mut)}
.lrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lrow i{width:10px;height:10px;border-radius:50%;flex:none}
.lrow .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .lt span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lr{display:flex;flex-direction:column;align-items:flex-end;font-size:12px}
.speedT .stx{text-align:center}
.morebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mlink{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 13px system-ui;cursor:pointer}
.mlink .mi{color:var(--acc)}
.mlink .mb{background:var(--warn);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.mlink.mt{border-style:dashed;color:var(--mut)}
.themes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.themes button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:12px system-ui;cursor:pointer}
.themes button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.themes i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.sig{text-align:center;font-size:12px;color:var(--mut);margin:16px 0 26px}
.sig b{color:var(--txt)}
/* plan */
#planWrap{position:absolute;inset:0;display:flex;flex-direction:column}
#planBar{display:block;padding:7px 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
#planBar .pbTop{display:flex;gap:8px;align-items:center}
#planBar .pbRow{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#planBar .pbRow::-webkit-scrollbar{display:none}
#planBar .btn{border-radius:999px;padding:6px 13px;white-space:nowrap;flex:none;background:transparent;color:var(--mut)}
#planBar .btn.on{outline:none;background:var(--acc);border-color:var(--acc);color:#fff}
#planBar .pbMore{display:none;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);align-items:center}
#planBar.more .pbMore{display:flex}
#planBox{flex:1;position:relative;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#planInfo{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 80px);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:12px var(--mono);pointer-events:none;white-space:pre-line}
#planBox.xmode #planInfo{display:none}
#ptools,#tools3{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:12}
#ptools button,#tools3 button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);color:var(--txt);font:700 20px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#ptools button.on,#tools3 button.on{background:var(--acc);color:#fff}
#scaleCtl{position:absolute;right:10px;bottom:10px;z-index:12;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:12px var(--mono)}
#crossCard{position:absolute;left:8px;right:64px;bottom:8px;max-height:55%;overflow:auto;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:8;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#planLegend{position:absolute;left:8px;top:8px;background:rgba(15,20,30,.85);color:#fff;border-radius:8px;padding:6px 9px;font:11px system-ui;line-height:1.5;z-index:6;pointer-events:none}
#planLegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
body.fs3 header,body.fs3 nav,body.fs3 #planBar,body.fs3 #threeBar{display:none!important}
/* 3D */
#threeWrap{position:absolute;inset:0;display:flex;flex-direction:column}
#threeBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#three{flex:1;position:relative;min-height:0;touch-action:none;overflow:hidden}
#three canvas{display:block;width:100%;height:100%}
#ptBox{position:absolute;right:64px;top:8px;max-width:min(300px,62%);background:color-mix(in srgb,var(--panel) 97%,transparent);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;z-index:6;box-shadow:0 2px 12px rgba(0,0,0,.5)}
#legBox3{position:absolute;left:8px;bottom:8px;background:rgba(15,20,30,.82);color:#fff;border-radius:8px;padding:6px 9px;font:11px system-ui;line-height:1.5;z-index:5;pointer-events:none}
#legBox3 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#threeMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mut)}
/* report */
.rep{background:#e9edf2;padding:12px;border-radius:12px}
.paper{background:#fff;color:#1a2230;max-width:800px;margin:0 auto;padding:26px 28px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:13px;line-height:1.5}
.paper h1{font-size:21px;margin:4px 0 2px;color:#0b2a4a}
.paper h2{color:#0b2a4a;font-size:12.5px;border-bottom:2px solid #0b2a4a;padding-bottom:3px;margin:18px 0 8px}
.paper .lh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid #0e8f8a;padding-bottom:10px}
.paper .org{font-size:11px;letter-spacing:.06em;color:#0e8f8a;font-weight:700;text-transform:uppercase}
.paper .sub{color:#555}
.paper .meta{font-size:12px;text-align:right;color:#333}
.paper table{font-size:12.5px}
.paper th,.paper td{border:1px solid #d5dbe3;color:#1a2230;text-transform:none;letter-spacing:0;font-size:12.5px}
.paper th{background:#f2f5f9;font-weight:600}
.paper .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.paper .kp{border:1px solid #d5dbe3;border-top:4px solid var(--k);border-radius:6px;padding:8px}
.paper .kp b{display:block;font:800 16px var(--mono);color:#0b2a4a}
.paper .kp span{font-size:11px;color:#555}
.paper .pbar{height:6px;background:#e6ebf1;border-radius:3px;margin-top:3px}
.paper .pbar i{display:block;height:100%;background:#0b5cad;border-radius:3px}
.paper tr.tot td{font-weight:700;background:#f7f9fc}
.paper .snaps img{width:100%;border:1px solid #d5dbe3;border-radius:4px}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}
.paper .sign>div{border-top:1px solid #333;padding-top:6px;font-size:11px;color:#555;display:flex;flex-direction:column}
.paper .sign b{color:#1a2230;font-size:12.5px}
.paper .foot{display:flex;justify-content:space-between;font-size:10px;color:#888;margin-top:18px;border-top:1px solid #eee;padding-top:6px}
@media print{
  body{overflow:visible;display:block;height:auto}
  header,nav,.noprint,#toast{display:none!important}
  main{position:static}
  .tab{position:static;display:none!important;padding:0;overflow:visible}
  #t-report{display:block!important}
  .rep{background:#fff;padding:0}
  .paper{box-shadow:none;max-width:none;padding:0}
  .paper h2{break-after:avoid}
}
@media(min-width:700px){.tile b{font-size:18px}.tile{min-height:150px;padding:16px}}

</style>
</head>
<body>
<header>
  <img id="hico" class="hico" alt="">
  <h1 id="title">Earthworks QA<small>Engr Muhammad Sheraz Abbasi</small></h1>
  <span id="stat">offline · on this phone</span><span class="dot"></span>
</header>
<main>
  <section class="tab on" id="t-home"></section>
  <section class="tab fill" id="t-plan"><div id="planWrap"><div id="planBar"></div><div id="planBox"><canvas id="plan"></canvas><div id="planInfo">Tap the map for N E Z · tap a point for details</div></div></div></section>
  <section class="tab" id="t-wir"></section>
  <section class="tab" id="t-check"></section>
  <section class="tab" id="t-vol"></section>
  <section class="tab fill" id="t-3d"><div id="threeWrap"><div id="threeBar"></div><div id="three"></div></div></section>
  <section class="tab" id="t-report"></section>
  <section class="tab" id="t-data"></section>
</main>

const APP='Earthworks QA';
const COL=['#f2a93b','#4fb3a5','#7aa2f7','#d9737f','#a78bfa','#f472b6','#34d399','#fbbf24'];
const STATUS={prior:'Before my QA',approved:'Approved',approved_open:'Approved – open item',rejected:'Rejected / redo',pending:'Pending'};
const ACTIVITIES=['Clearing & grubbing','Stripping / preparation','Excavation (cut)','Fill layer','Compaction','Grading / trimming','Final grading','Survey / levels','Other'];
const REF_REASONS={dry:'Not dry (wet / soft surface)',comp:'Not compacted',lvl:'Not finished / not to level',lab:'No lab test / approval',area:'Wrong area',safe:'Safety / access',other:'Other'};

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
function h(t,a={},...k){
  const e=document.createElement(t);
  for(const [x,v] of Object.entries(a||{})){
    if(v===false||v==null)continue;
    if(x==='class')e.className=v;
    else if(x==='style')e.style.cssText=v;
    else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);
    else if(x==='value'||x==='checked'||x==='selected'||x==='disabled')e[x]=v;
    else e.setAttribute(x,v===true?'':v);
  }
  for(const c of k.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));
  return e;
}
function sv(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const [k,v] of Object.entries(a||{}))e.setAttribute(k,v);return e}
function mmin(a){let m=Infinity;for(const v of a)if(v<m)m=v;return m}
function mmax(a){let m=-Infinity;for(const v of a)if(v>m)m=v;return m}
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en',{maximumFractionDigits:d,minimumFractionDigits:d});
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dmy(s){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'')}
function dshort(s){if(!s)return '–';const [y,m,d]=s.split('-');return +d+' '+MON[m-1]+' '+y}
function dlong(s){const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
const dAdd=(s,mo)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+mo);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dMs=s=>new Date(s+'T00:00:00').getTime();
const pct=(d,t)=>t>0?Math.min(100,d/t*100):0;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
function download(name,text,type){const a=h('a',{href:URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type:type||'text/plain'})),download:name});document.body.append(a);a.click();a.remove()}
function toast(msg){const o=document.getElementById('toast');if(o)o.remove();const t=h('div',{id:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),3500)}
function ur(t){return h('div',{class:'ur'},t)}   // Roman Urdu help line
const _js={};function loadJs(u){if(_js[u])return _js[u];return _js[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete _js[u];s.remove();no(new Error('Could not load '+u.split('/').pop()+' (needs internet the first time)'))};document.head.append(s)})}
function readFileText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsText(f)})}
async function readTable(f){ // csv / txt / xlsx -> tab separated text
  if(/\.xls/i.test(f.name)){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_csv(ws,{FS:'\t'});
  }
  return readFileText(f);
}
function fileBtn(label,accept,cb,cls){
  const fi=h('input',{type:'file',accept,style:'display:none',onchange:async e=>{const f=e.target.files[0];e.target.value='';if(f)cb(f)}});
  return h('span',{},h('button',{class:'btn '+(cls||''),onclick:()=>fi.click()},label),fi);
}

/* ---------- storage: IndexedDB (big data) + localStorage copy ---------- */
let _db=null;
function idb(){if(_db)return _db;_db=new Promise((ok,no)=>{const r=indexedDB.open('sheraz-earthworks-qa',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return _db}
async function idbGet(k){try{const d=await idb();return await new Promise((ok,no)=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>no(t.error)})}catch(e){return undefined}}
async function idbSet(k,v){try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)});return true}catch(e){return false}}

/* ---------- state ---------- */
let S={};
const KEYS=['meta','phases','areas','wirs','cwir','checks','cf','refusals','ctrl'];
function normalize(){for(const k of KEYS)if(!S[k]||typeof S[k]!=='object')S[k]={};
  const m=S.meta;if(!m.by)m.by=OWNER+', Survey Engineer';if(m.tol==null)m.tol=0.10;if(!m.nPh)m.nPh=4;if(!m.zone)m.zone=38;if(m.south==null)m.south=false;
  if(m.strip==null)m.strip=0.30;if(m.layer==null)m.layer=0.30;}
let saveT=0,lastSaved='';
function saveNow(){clearTimeout(saveT);saveT=0;const j=JSON.stringify(S);idbSet('state',S);if(j.length<4.5e6)try{localStorage.setItem('sq_state',j)}catch(e){}lastSaved=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});const st=$('#stat');if(st)st.textContent='saved '+lastSaved}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
addEventListener('pagehide',()=>{if(saveT)saveNow()});
addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)saveNow()});
function setAt(o,parts,val){
  for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=='object'||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];if(val===null||val===undefined)delete o[k];else o[k]=val;
}
function invalidate(path){
  if(/^areas/.test(path)){AREAS=null;areaSt=null;refreshDesignPhases()}
  if(/^phases\/\d+\/poly/.test(path)||/^meta\/nPh/.test(path))refreshDesignPhases();
  if(/^cwir|^wirs|^meta\/tol|^meta\/cellArea/.test(path)){doneC=null}
  rast=null;dirty3D=true;

let wirFilter='all',wirFocus=0;
function safeUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function openWirRef(no){wirFocus=+no;wirFilter='all';showTab('wir')}
function wirByRef(t){t=t.toLowerCase();return Object.values(S.wirs).find(w=>w.ref&&w.ref.toLowerCase()===t)}
function linkify(text){
  const out=[],re=/(WIR[\s\-#]*0*(\d{1,5}))/gi;let last=0,m;
  while((m=re.exec(text))){const no=+m[2];out.push(text.slice(last,m.index));

function splitRow(l){return l.split(/\t|,|;|\s+/).map(s=>s.trim()).filter(s=>s!=='')}
function parseDesignText(txt,swap){

    hd.forEach((s,i)=>{if(/^(pt|point|id|no|name|#|p)\b|point/.test(s)&&c.id<0&&!/phase/.test(s))c.id=i;else if(/north|^n$|^y$|\(y\)|northing/.test(s))c.N=i;else if(/east|^e$|^x$|\(x\)|easting/.test(s))c.E=i;

function parseAreasText(txt){ // rows: Area, N, E [,Phase][,Zone]  — consecutive rows of the same area = its corners in order

/* ---------- demo project (synthetic site, for trying every feature) ---------- */
function loadDemo(){
  if((Object.keys(S.wirs).length||DES)&&!confirm('Replace the data on this phone with the demo project? (Download a backup first if you need it.)'))return;
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const E0=668200,N0=2734600,ang=28*Math.PI/180,ca=Math.cos(ang),sa=Math.sin(ang),s=10,NU=130,NV=70;
  const W2=(u,v)=>[E0+u*ca-v*sa,N0+u*sa+v*ca];
  const E=[],N=[],Z=[],G=[],P=[];
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u=i*s,v=j*s,[e,n]=W2(u,v),z=612+u*0.004-v*0.002+0.6*Math.sin(u/260);
    const g=z-(0.9*Math.sin(u/95+1)+0.6*Math.cos(v/60)+0.35*Math.sin((u+v)/40))-0.15+(rnd()-.5)*0.06;E.push(+e.toFixed(3));N.push(+n.toFixed(3));Z.push(+z.toFixed(3));G.push(+g.toFixed(3));P.push(0)}
  S={};normalize();const m=S.meta;Object.assign(m,{name:'Demo Grading Project',sub:'Demo · Earthwork grading QA',nPh:4,zone:38,tol:0.10,strip:0.30,layer:0.30});
  const L=NU*s,Wd=NV*s;
  for(let p=1;p<=4;p++){const u0=(p-1)*L/4,u1=p*L/4;S.phases[p]={name:'Phase '+p,color:COL[p-1],poly:polyStr([W2(u0-5,-5),W2(u1-5,-5),W2(u1-5,Wd-5),W2(u0-5,Wd-5)]),boq:{clr:[0,0],cut:[0,0],fill:[0,0]}}}
  let ai=0;for(let p=1;p<=4;p++)for(let z=1;z<=2;z++)for(let a=1;a<=2;a++){const u0=(p-1)*L/4+(a-1)*L/8,u1=u0+L/8,v0=(z-1)*Wd/2,v1=v0+Wd/2;ai++;
    S.areas['a'+ai]={name:'P'+p+'-Z'+z+'-A'+String(a+(z-1)*2).padStart(2,'0'),phase:p,zone:'Z'+z,c:polyStr([W2(u0-5,v0-5),W2(u1-5,v0-5),W2(u1-5,v1-5),W2(u0-5,v1-5)])}}
  setDesign({E,N,Z,G,P,src:'Demo surface, '+E.length+' points'},true);AREAS=null;
  for(const i of phIds()){const r=ngStats(i,-30,0);S.phases[i].boq={clr:[Math.round((DES.ph[i]||{area:0}).area*1.02),0],cut:[Math.round(r.cut*1.04),0],fill:[Math.round(r.fill*1.06),0]}}
  const dd=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  m.sched={start:dd(120),months:18,dw:6,fillRate:1500,clrRate:2500,cutRate:0,shape:'s',off:SCH_DEF.off};
  const AL=areaList(),mkPts=(a,layer,prev)=>{const out=[],pp={};for(const i of nearIdxPoly(a)){const z=DES.Z[i],g=DES.G[i];if(prev&&prev[i]==null)continue;const base=prev?prev[i]:Math.min(g-0.30,z);
      let c;if(layer===0)c=Math.min(g-0.30,z);else{const t=0.30+(rnd()-.5)*0.04;c=Math.min(base+t,z+(rnd()-.5)*0.02)}if(base>=z-0.005&&layer>0)continue;
      pp[i]=c;out.push([String(i+1),N[i].toFixed(3),E[i].toFixed(3),z.toFixed(3),(layer===0?g:base).toFixed(3),c.toFixed(3)].join(','))}return {pts:out.join(';'),pp}};
  let no=0;const add=(a,layer,day,status,prev,extra)=>{no++;const r=mkPts(a,layer,prev);if(!r.pts)return r;
    S.wirs[no]=Object.assign({no,cno:'WIR-'+String(no+100).padStart(4,'0'),ref:a.name,layer:layer===0?'PREP':String(layer),activity:layer===0?'Stripping / preparation':'Fill layer',phase:a.phase,loc:'Zone '+a.zone,sub:dd(day+1),date:dd(day),status,mine:true,notes:'',items:{},desc:a.name+(layer===0?' preparation':' layer '+String(layer).padStart(2,'0'))},extra||{});
    S.cwir[no]={src:'Demo table, '+r.pts.split(';').length+' points',pts:r.pts};return r};
  let r1=add(AL[0],0,60,'approved');let r2=add(AL[0],1,48,'approved',r1.pp);let r3=add(AL[0],2,30,'approved_open',r2.pp,{items:{i1:{t:'North-east corner: 3 points 6 cm low',done:false}}});add(AL[0],3,6,'pending',r3.pp);
  let b1=add(AL[1],0,44,'approved');let b2=add(AL[1],1,25,'approved',b1.pp);add(AL[1],2,3,'pending',b2.pp);
  let c1=add(AL[4],0,20,'approved');add(AL[4],1,1,'pending',c1.pp);add(AL[8],0,10,'rejected',null,{notes:'Topsoil not fully removed along the west edge.'});

  const cp=[[0,0],[L,0],[L,Wd],[0,Wd],[L/2,Wd/2],[L/4,-60]];cp.forEach(([u,v],i)=>{const [e,n]=W2(u,v);S.ctrl[i<2?'BM-0'+(i+1):'CP-'+String(i+1).padStart(2,'0')]={N:+n.toFixed(3),E:+e.toFixed(3),z:+(612+u*.004).toFixed(3),bm:i<2}});
  AREAS=null;areaSt=null;doneC=null;refreshDesignPhases();saveNow();view.set=false;toast('Demo project loaded');goHome();
}

/* ---------- icon, manifest, install ---------- */
function squarePhoto(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);ok(c.toDataURL('image/jpeg',.85))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}
const _iconCache={};
function appIcon(sz){
  const key=sz+':'+(S.meta&&S.meta.icon?S.meta.icon.length:0);if(_iconCache[key])return _iconCache[key];
  const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
  if(S.meta&&S.meta.icon){const im=new Image();im.src=S.meta.icon;try{x.drawImage(im,0,0,sz,sz)}catch(e){}if(!im.complete){im.onload=()=>{delete _iconCache[key];setIcons()};return S.meta.icon}return _iconCache[key]=c.toDataURL('image/png')}
  return _iconCache[key]=(sz<=192?ICON_192:ICON_512);
  x.fillStyle='#0f2c52';x.fillRect(0,0,sz,sz);const m=sz*.12,w=sz-2*m,cx=m+w/2,cy=m+w*.36,F='system-ui,Segoe UI,Roboto,Arial,sans-serif',mix=(a,b,t)=>Math.round(a+(b-a)*t);
  for(let k=0;k<6;k++){const t=k/5,R=w*(.34-.054*k);x.beginPath();for(let i=0;i<=120;i++){const th=i/120*Math.PI*2,r=R*(1+.11*Math.sin(2*th+1.1+k*.35)+.06*Math.sin(3*th+k*.8));const px=cx+r*Math.cos(th)*1.08,py=cy+r*Math.sin(th)*.92;i?x.lineTo(px,py):x.moveTo(px,py)}
    x.closePath();x.strokeStyle=`rgb(${mix(79,246,t)},${mix(209,196,t)},${mix(197,83,t)})`;x.lineWidth=w*(.026-.002*k);x.stroke()}
  x.fillStyle='#f6c453';x.beginPath();x.moveTo(cx,m);x.lineTo(cx+w*.05,m+w*.09);x.lineTo(cx,m+w*.065);x.lineTo(cx-w*.05,m+w*.09);x.closePath();x.fill();
  x.textAlign='center';x.fillStyle='#f6c453';x.font='700 '+(w*.11)+'px '+F;x.fillText('ENGR M. SHERAZ',cx,m+w*.83);x.fillStyle='#fff';x.font='800 '+(w*.17)+'px '+F;x.fillText('ABBASI',cx,m+w*1.0);
  return _iconCache[key]=c.toDataURL('image/png')}
function setIcons(){ // static manifest + PNG icons ship with the app; only a custom photo set in Data overrides the page icon
  try{const u=appIcon(192);const hi=$('#hico');if(hi)hi.src=u;
    if(S.meta&&S.meta.icon)document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon]').forEach(l=>l.href=u)}catch(e){}}

  let st=await idbGet('state');if(!st)st=lsGet('sq_state',null);S=st&&typeof st==='object'?st:{};normalize();
  const d=await idbGet('design');if(d&&d.E&&d.E.length)setDesign({E:d.E,N:d.N,Z:d.Z,G:d.G?Array.from(d.G,x=>x===x?x:null):null,P:d.P,ids:d.ids,src:d.src},false);
