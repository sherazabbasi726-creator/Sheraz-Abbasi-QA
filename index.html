<style>
/* Layout: one-screen field app — brand header, scrolling tab views, bottom icon nav, bottom sheet for details. Strata (soil layers) is the visual motif. */
:root{
  --bg:#edf0ec; --panel:#ffffff; --panel2:#f5f7f4; --ink:#16211f; --muted:#5b6a65; --line:#d5ddd8;
  --brand:#123a35; --brand2:#1d5a51; --brand-ink:#eaf4f0; --accent:#d98b2b; --accent-ink:#241505;
  --sand:#d9c49a; --soil:#9c7a52; --clay:#7a5a3a;
  --cut:#c8433a; --fill:#2f73c0; --ok:#2f9a62; --near:#d6a01c; --held:#8e5bc4; --pend:#8a948f;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(18,58,53,.06),0 6px 18px rgba(18,58,53,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --panel:#152120; --panel2:#1a2826; --ink:#e4ede9; --muted:#93a39e; --line:#273634;
  --brand:#0a2420; --brand2:#164a42; --brand-ink:#dcebe6; --accent:#e9a24a; --accent-ink:#241505;
  --sand:#8c7a58; --soil:#6e5539; --clay:#54402a;
  --cut:#ea6a5c; --fill:#5b9ee6; --ok:#4cc483; --near:#e9bb3f; --held:#ad85e0; --pend:#7c8884;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --panel:#152120; --panel2:#1a2826; --ink:#e4ede9; --muted:#93a39e; --line:#273634;
  --brand:#0a2420; --brand2:#164a42; --brand-ink:#dcebe6; --accent:#e9a24a; --accent-ink:#241505;
  --sand:#8c7a58; --soil:#6e5539; --clay:#54402a;
  --cut:#ea6a5c; --fill:#5b9ee6; --ok:#4cc483; --near:#e9bb3f; --held:#ad85e0; --pend:#7c8884;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brand-ink);padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:11px;flex:none}
.logo{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25)}
h1{font-family:var(--display);font-size:24px;letter-spacing:.03em;margin:0;line-height:.95;font-weight:800}
h1 small{font:600 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.72;display:block;margin-top:3px}
.who{margin-left:auto;text-align:right;font-size:11px;line-height:1.3;opacity:.92;min-width:0}
.who b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;opacity:.8}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(76,196,131,.2)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:14px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.view.full{padding:0;overflow:hidden}
nav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:auto}
nav button{flex:1;min-width:46px;background:none;border:0;color:var(--muted);font:600 9.5px var(--body);letter-spacing:.02em;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand2)}
:root:not([data-theme="light"]) nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media (prefers-color-scheme:light){nav button.on{color:var(--brand2)}}
:root[data-theme="light"] nav button.on{color:var(--brand2)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
h2{font-family:var(--display);font-size:20px;letter-spacing:.04em;margin:0;text-transform:uppercase;font-weight:700}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch small{color:var(--muted);font-size:11.5px}
.muted{color:var(--muted)}.small{font-size:12px}
.ur{font-size:11.5px;color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;box-sizing:border-box}
textarea{width:100%;font-family:var(--mono);font-size:12px;min-height:110px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select{color:var(--ink);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btn{font:700 13px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--cut)}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,nav button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* hero */
.hero{background:linear-gradient(160deg,var(--brand),var(--brand2));color:var(--brand-ink);border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.hero canvas{display:block;width:100%;height:120px}
.hin{padding:16px 16px 4px;position:relative}
.hn{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;letter-spacing:.02em}
.hs{font-size:12px;opacity:.8;margin-top:4px}
.hgrid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:14px}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:800}
.ring b span{display:block;font:600 9px var(--body);letter-spacing:.12em;opacity:.7;margin-top:-30px}
.hk{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.hk div b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hk div span{font-size:10.5px;opacity:.75;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line))}
.kpi b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.verdict{display:flex;gap:12px;align-items:center}
.gauge{width:110px;flex:none}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar span{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13.5px}
.li .t span{font-size:11.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* plan */
#planBox{position:absolute;inset:0}
canvas.map{display:block;width:100%;height:100%;touch-action:none;background:var(--bg)}
.mapbar{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto;box-shadow:var(--shadow)}
.mapbar select{padding:7px 8px;font-size:12.5px}
.legend{position:absolute;bottom:10px;left:max(10px,env(safe-area-inset-left,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px 11px;font-size:11.5px;max-width:calc(100% - 84px);box-shadow:var(--shadow)}
.lg{display:flex;align-items:center;gap:5px}
.fab{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.fab .btn{width:44px;height:44px;padding:0;font-size:18px;box-shadow:var(--shadow)}
.fab .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.info{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:20px;white-space:nowrap;box-shadow:var(--shadow);max-width:90%;overflow:hidden;text-overflow:ellipsis}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.tap{cursor:pointer}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.28);max-height:86%;overflow:auto;z-index:20;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.dl div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dl b{display:block;font-family:var(--mono);font-size:14.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.dl small{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.03em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:13px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.confirm{background:var(--panel2);border:1px solid var(--cut);border-radius:10px;padding:10px;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:16px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;background:linear-gradient(to top,var(--brand2),var(--fill));border-radius:4px 4px 0 0;position:relative;min-width:5px}
.chart .c i{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;color:var(--muted)}
.xl{display:flex;gap:4px;font-size:9.5px;color:var(--muted);margin-top:3px}
.xl span{flex:1;text-align:center;min-width:5px;overflow:hidden}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 12px var(--body);padding:7px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.result{border-radius:14px;padding:14px;color:#fff;display:flex;align-items:center;gap:12px}
.result b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
#three{position:absolute;inset:44px 0 0 0;touch-action:none}
#threeBar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.03em}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}}}
</style>

<script>
(function(){
'use strict';
const KEY='sheraz-earthworks-v2';
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dAdd=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dNice=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return +d+' '+MON[m-1]+' '+y};
const f3=x=>(x==null||isNaN(x))?'—':(+x).toFixed(3);
const cm=x=>(x==null||isNaN(x))?'—':(x>0?'+':'')+(x*100).toFixed(1);
const fmt=x=>Math.round(x).toLocaleString('en-US');

/* ================= state ================= */
let S={
  meta:{proj:'Sample Project',sub:'Enabling · Earthworks',eng:'Eng Sheraz Abbasi',role:'Survey Engineer',tol:0.03,near:0.10,lay:0.30,cell:100,start:'',months:6,utm:38,band:6,email:''},
  sample:true,points:[],wirs:[],checks:[]
};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.points)){S.meta=Object.assign(S.meta,o.meta||{});S.points=o.points;S.wirs=o.wirs||[];S.checks=o.checks||[];S.sample=!!o.sample;return true}}}catch(e){}return false}

/* ================= sample ================= */
function makeSample(){
  const pts=[],t=today();S.meta.start=dAdd(t,-60);S.meta.months=5;
  let k=5001;
  for(let r=0;r<12;r++)for(let c=0;c<16;c++){
    const e=667100+c*10+r*2.5,n=2761300+r*10-c*1.2;
    const ngl=+(636.4+0.045*c-0.03*r+0.32*Math.sin(c/2.3+r/3.1)).toFixed(3);
    const dg=+(637.05+0.012*c-0.006*r).toFixed(3);
    const zone=c<8?'Phase 1':'Phase 2',area=(c<8?'M4P1-':'M4P2-')+String(r<6?1:2).padStart(3,'0');
    const p={id:String(k++),e:+e.toFixed(3),n:+n.toFixed(3),ngl,dg,zone,area,layers:[]};
    if(dg>ngl+S.meta.tol){
      const need=layersNeeded(p),done=Math.max(0,Math.min(need,(c*3+r*2)%(need+2)));
      let rl=ngl-S.meta.lay;
      for(let i=0;i<done;i++){rl=Math.min(dg,rl+S.meta.lay);const last=i===need-1;p.layers.push({rl:+(last?dg+((c+r)%5-2)*0.012:rl+((i%3)-1)*0.01).toFixed(3),date:dAdd(t,-(50-i*9-(c%4)-(r%3))),wir:''})}
    }else if(ngl>dg+S.meta.tol&&(c+r)%3!==0){p.layers.push({rl:+(dg+((c%5)-2)*0.018).toFixed(3),date:dAdd(t,-((r*3+c)%20)),wir:''})}
    pts.push(p);
  }
  S.points=pts;
  const acts=['Fill layer','Fill layer','Final grading','Excavation (cut)','Compaction','Stripping'];

/* ================= QA logic ================= */
const M=()=>S.meta;
const cur=p=>p.layers.length?p.layers[p.layers.length-1].rl:p.ngl;
const diff=p=>cur(p)-p.dg;
function status(p){const d=diff(p);if(Math.abs(d)<=M().tol)return'ok';if(Math.abs(d)<=M().near)return'near';return d>0?'cut':'fill'}
function layersNeeded(p){if(p.dg<=p.ngl+M().tol)return p.ngl>p.dg+M().tol?1:0;return Math.ceil((p.dg-(p.ngl-M().lay))/M().lay-1e-9)}
function layersLeft(p){const d=diff(p);if(Math.abs(d)<=M().tol)return 0;if(d>0)return 1;return Math.ceil(-d/M().lay-1e-9)}
function nextReq(p){if(p.dg<=p.ngl)return p.dg;if(!p.layers.length)return +(p.ngl-M().lay).toFixed(3);return +Math.min(p.dg,cur(p)+M().lay).toFixed(3)}
const STAT={cut:['Cut needed','--cut'],fill:['Fill needed','--fill'],near:['Near grade','--near'],ok:['On grade','--ok']};
const WST={approved:['Approved','--ok'],approved_open:['Approved – open item','--near'],pending:['Pending','--pend'],rejected:['Rejected / redo','--cut'],held:['Held','--held']};
const ACTS=['Fill layer','Final grading','Excavation (cut)','Compaction','Stripping','Clearing & grubbing','Grading / trimming','Waste removal','Survey / levels','Other'];
function vols(ps){
  const c=M().cell;let fT=0,fD=0,cT=0,cD=0;
  ps.forEach(p=>{const now=cur(p);
    if(p.dg>p.ngl){fT+=(p.dg-p.ngl)*c;fD+=Math.max(0,Math.min(now,p.dg)-p.ngl)*c}
    else{cT+=(p.ngl-p.dg)*c;cD+=Math.max(0,p.ngl-Math.max(now,p.dg))*c}});
  return{fT,fD,cT,cD,fR:fT-fD,cR:cT-cD,tot:fT+cT,done:fD+cD};
}
function layerStats(ps){let done=0,need=0;ps.forEach(p=>{done+=p.layers.length;need+=Math.max(layersNeeded(p),p.layers.length+layersLeft(p))});return{done,need}}
function byDate(ps){const o={};ps.forEach(p=>p.layers.forEach(l=>{if(l.date)o[l.date]=(o[l.date]||0)+1}));return o}

/* ================= UTM ================= */
function ll2utm(lat,lon,zone){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2);
  const lon0=((zone-1)*6-180+3)*Math.PI/180,φ=lat*Math.PI/180,λ=lon*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(φ)**2),T=Math.tan(φ)**2,C=ep2*Math.cos(φ)**2,A=Math.cos(φ)*(λ-lon0);
  const Mm=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*φ-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*φ)+(15*e2**2/256+45*e2**3/1024)*Math.sin(4*φ)-(35*e2**3/3072)*Math.sin(6*φ));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  const Nn=k0*(Mm+N*Math.tan(φ)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  return[E,lat<0?Nn+1e7:Nn];
}

  ctx.fillStyle=css('--ink');ctx.font='800 13px '+css('--display');ctx.textAlign='center';ctx.fillText('N',W-30,66);ctx.beginPath();ctx.moveTo(W-30,70);ctx.lineTo(W-36,86);ctx.lineTo(W-30,82);ctx.lineTo(W-24,86);ctx.closePath();ctx.fill();ctx.textAlign='left';

const ptrs=new Map();let pinch=null,moved=false,down=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=false;down={x:e.offsetX,y:e.offsetY};if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s}}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const pv=ptrs.get(e.pointerId),c={x:e.offsetX,y:e.offsetY};ptrs.set(e.pointerId,c);
  if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d/view.s);moved=true;return}
  if(Math.hypot(c.x-down.x,c.y-down.y)>6)moved=true;if(moved){view.cx-=(c.x-pv.x)/view.s;view.cy+=(c.y-pv.y)/view.s;drawPlan()}});
cv.addEventListener('pointerup',e=>{if(ptrs.size===1&&!moved)planTap(e.offsetX,e.offsetY);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.15:1/1.15)},{passive:false});
function zoomAt(x,y,f){const[wx,wy]=toW(x,y);view.s*=f;const[nx,ny]=toS(wx,wy);view.cx+=(nx-x)/view.s;view.cy-=(ny-y)/view.s;drawPlan()}
$('zin').onclick=()=>zoomAt(W/2,H/2,1.4);$('zout').onclick=()=>zoomAt(W/2,H/2,1/1.4);$('zfit').onclick=()=>{fitPlan();drawPlan()};
function planTap(x,y){
  if(secMode){const w=toW(x,y);if(!secA||secB){secA=w;secB=null;$('planInfo').textContent='Now tap point B';drawPlan()}else{secB=w;drawPlan();showSection()}return}
  let best=null,bd=28;planPts().forEach(p=>{const[sx,sy]=toS(p.e,p.n),d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=p}});
  if(best)openPoint(best);else closeSheet();
}
$('bSec').onclick=()=>{secMode=!secMode;$('bSec').classList.toggle('on',secMode);secA=secB=null;$('planInfo').textContent=secMode?'Cross-section: tap point A':'Tap a control point for details';$('planInfo').hidden=false;drawPlan()};
$('bGps').onclick=()=>{
  if(gpsWatch!=null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gps=null;$('bGps').classList.remove('on');drawPlan();toast('GPS off');return}
  if(!navigator.geolocation){toast('GPS is not available on this device');return}
  $('bGps').classList.add('on');toast('Finding your position…');
  try{gpsWatch=navigator.geolocation.watchPosition(pos=>{const[e,n]=ll2utm(pos.coords.latitude,pos.coords.longitude,+M().utm||38);const first=!gps;gps=[e,n,pos.coords.accuracy||10];
    if(first){view.cx=e;view.cy=n;}const nr=nearest(e,n);$('planInfo').hidden=false;$('planInfo').textContent=`You: E ${e.toFixed(1)} N ${n.toFixed(1)} ±${Math.round(gps[2])} m${nr?` · nearest ${nr.p.id} (${nr.d.toFixed(1)} m)`:''}`;drawPlan()},
    err=>{toast('GPS not allowed here. Open the app from your own site link.');$('bGps').classList.remove('on');gpsWatch=null},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}catch(e){toast('GPS not allowed here');$('bGps').classList.remove('on')}
};
function nearest(e,n){let b=null,bd=1/0;S.points.forEach(p=>{const d=Math.hypot(p.e-e,p.n-n);if(d<bd){bd=d;b=p}});return b?{p:b,d:bd}:null}

function showSection(){
  const[ax,ay]=secA,[bx,by]=secB,L=Math.hypot(bx-ax,by-ay);if(L<1){toast('Pick two points further apart');return}
  const ux=(bx-ax)/L,uy=(by-ay)/L,band=+M().band||6;
  const pts=S.points.map(p=>{const dx=p.e-ax,dy=p.n-ay,ch=dx*ux+dy*uy,off=Math.abs(-dx*uy+dy*ux);return{p,ch,off}}).filter(o=>o.ch>=-band&&o.ch<=L+band&&o.off<=band).sort((a,b)=>a.ch-b.ch);
  openSheet(`<div class="ch"><h2>Cross-section A–B</h2><small>${L.toFixed(1)} m · band ±${band} m · ${pts.length} pts</small></div>
  ${pts.length<2?'<div class="empty">Not enough points near this line. Draw it across the grid.</div>':`<canvas id="secCv" style="width:100%;height:220px;display:block"></canvas>
  <div class="row small" style="gap:14px;margin-top:8px"><span class="lg"><span class="dot" style="background:var(--soil)"></span>NGL</span><span class="lg"><span class="dot" style="background:var(--accent)"></span>Design</span><span class="lg"><span class="dot" style="background:var(--fill)"></span>Current</span></div>
  <div class="tbl" style="margin-top:10px;max-height:220px"><table><thead><tr><th>Point</th><th>Ch (m)</th><th>NGL</th><th>Current</th><th>Design</th><th>Diff cm</th></tr></thead><tbody>${pts.map(o=>`<tr><td>${esc(o.p.id)}</td><td>${o.ch.toFixed(1)}</td><td>${f3(o.p.ngl)}</td><td>${f3(cur(o.p))}</td><td>${f3(o.p.dg)}</td><td>${cm(diff(o.p))}</td></tr>`).join('')}</tbody></table></div>`}
  <div class="row" style="margin-top:10px"><button class="btn sm" id="secNew">New section</button><button class="btn sm" id="secClose" style="margin-left:auto">Close</button></div>`);
  $('secClose').onclick=closeSheet;$('secNew').onclick=()=>{secA=secB=null;closeSheet();$('planInfo').textContent='Cross-section: tap point A';drawPlan()};
  if(pts.length<2)return;
  requestAnimationFrame(()=>{const c=$('secCv'),r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);
    const w=r.width,h=r.height,pl=46,pr=10,pt=12,pb=26;
    const zs=pts.flatMap(o=>[o.p.ngl,o.p.dg,cur(o.p)]),z0=Math.min(...zs)-.1,z1=Math.max(...zs)+.1,c0=Math.min(0,pts[0].ch),c1=Math.max(L,pts[pts.length-1].ch);
    const X=v=>pl+(v-c0)/(c1-c0)*(w-pl-pr),Y=v=>pt+(z1-v)/(z1-z0)*(h-pt-pb);
    x.strokeStyle=css('--line');x.fillStyle=css('--muted');x.font='9.5px '+css('--mono');x.lineWidth=1;
    const zs2=niceStep((z1-z0)/4);for(let z=Math.ceil(z0/zs2)*zs2;z<=z1;z+=zs2){x.beginPath();x.moveTo(pl,Y(z));x.lineTo(w-pr,Y(z));x.stroke();x.fillText(z.toFixed(2),2,Y(z)+3)}
    const cs=niceStep((c1-c0)/5);for(let v=Math.ceil(c0/cs)*cs;v<=c1;v+=cs)x.fillText(v.toFixed(0),X(v)-6,h-8);
    x.fillStyle=css('--sand');x.globalAlpha=.55;x.beginPath();x.moveTo(X(pts[0].ch),Y(z0));pts.forEach(o=>x.lineTo(X(o.ch),Y(o.p.ngl)));x.lineTo(X(pts[pts.length-1].ch),Y(z0));x.fill();x.globalAlpha=1;
    const line=(f,col,dash,wd)=>{x.strokeStyle=col;x.lineWidth=wd;x.setLineDash(dash);x.beginPath();pts.forEach((o,i)=>{const yy=Y(f(o.p));i?x.lineTo(X(o.ch),yy):x.moveTo(X(o.ch),yy)});x.stroke();x.setLineDash([])};
    line(p=>p.ngl,css('--soil'),[],2);line(p=>p.dg,css('--accent'),[7,5],2.5);line(cur,css('--fill'),[],2.5);
    pts.forEach(o=>{x.fillStyle=css(STAT[status(o.p)][1]);x.beginPath();x.arc(X(o.ch),Y(cur(o.p)),3.5,0,7);x.fill()});
  });
}

const T3={r:null};let ex3=8,show3='both';
function render3d(){
  const host=$('three');
  $('threeBar').innerHTML=`<div class="seg" style="flex:none"><button data-m="both">Current + NGL</button><button data-m="cur">Current</button><button data-m="design">Design</button></div>
  <label class="small row" style="gap:6px;flex:none">Height ×<input id="ex3" type="range" min="1" max="30" value="${ex3}" style="width:90px;padding:0"></label><button class="btn sm" id="r3" style="flex:none">Reset view</button>`;
  $('threeBar').querySelectorAll('[data-m]').forEach(b=>{b.classList.toggle('on',b.dataset.m===show3);b.onclick=()=>{show3=b.dataset.m;render3d()}});
  $('ex3').oninput=e=>{ex3=+e.target.value;build3()};$('r3').onclick=()=>{T3.rx=.9;T3.ry=.6;T3.dist=T3.d0;place3()};
  if(typeof THREE==='undefined'){host.innerHTML='<div class="empty">3D library could not load. Connect to the internet once and reopen.</div>';return}
  if(!T3.r){
    T3.r=new THREE.WebGLRenderer({antialias:true,alpha:true});T3.r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));host.appendChild(T3.r.domElement);
    T3.scene=new THREE.Scene();T3.cam=new THREE.PerspectiveCamera(45,1,1,50000);T3.rx=.9;T3.ry=.6;
    T3.scene.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(1,2,1);T3.scene.add(dl);
    const el=T3.r.domElement;el.style.touchAction='none';const P=new Map();let pd=null;
    el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const[a,b]=[...P.values()];pd={d:Math.hypot(a[0]-b[0],a[1]-b[1]),dist:T3.dist}}});
    el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
      if(P.size===2&&pd){const[a,b]=[...P.values()];T3.dist=pd.dist*pd.d/Math.max(10,Math.hypot(a[0]-b[0],a[1]-b[1]));place3();return}
      T3.ry-=(e.clientX-o[0])*.008;T3.rx=Math.max(.1,Math.min(1.5,T3.rx+(e.clientY-o[1])*.006));place3()});
    const up=e=>{P.delete(e.pointerId);if(P.size<2)pd=null};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    el.addEventListener('wheel',e=>{e.preventDefault();T3.dist*=e.deltaY>0?1.12:1/1.12;place3()},{passive:false});
  }
  if(!host.contains(T3.r.domElement))host.appendChild(T3.r.domElement);
  build3();requestAnimationFrame(size3);
}
function size3(){const h=$('three'),w=h.clientWidth,hh=h.clientHeight;if(!w||!hh)return;T3.r.setSize(w,hh);T3.cam.aspect=w/hh;T3.cam.updateProjectionMatrix();place3()}
function build3(){
  if(!T3.r)return;if(T3.g){T3.scene.remove(T3.g);T3.g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
  const ps=S.points;if(!ps.length){T3.r.render(T3.scene,T3.cam);return}
  let x0=1/0,x1=-1/0,y0=1/0,y1=-1/0,z0=1/0;ps.forEach(p=>{x0=Math.min(x0,p.e);x1=Math.max(x1,p.e);y0=Math.min(y0,p.n);y1=Math.max(y1,p.n);z0=Math.min(z0,p.ngl,p.dg,cur(p))});
  const cx=(x0+x1)/2,cy=(y0+y1)/2,span=Math.max(x1-x0,y1-y0,10);T3.d0=span*1.4;if(!T3.dist)T3.dist=T3.d0;
  const g=new THREE.Group();const pos=(p,z)=>[p.e-cx,(z-z0)*ex3,-(p.n-cy)];
  const sp=span/Math.sqrt(ps.length)*.42;
  const cloud=(fz,colF,size)=>{const a=new Float32Array(ps.length*3),c=new Float32Array(ps.length*3);ps.forEach((p,i)=>{const v=pos(p,fz(p));a.set(v,i*3);const cc=new THREE.Color(colF(p));c.set([cc.r,cc.g,cc.b],i*3)});
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(a,3));geo.setAttribute('color',new THREE.BufferAttribute(c,3));
    return new THREE.Points(geo,new THREE.PointsMaterial({size,vertexColors:true,sizeAttenuation:true}))};
  const statusCol=p=>css(STAT[status(p)][1]);
  if(show3!=='design')g.add(cloud(cur,statusCol,sp*1.15));
  if(show3==='both'){g.add(cloud(p=>p.ngl,()=>css('--soil'),sp*.7));
    const la=[];ps.forEach(p=>{if(Math.abs(cur(p)-p.ngl)>.02){la.push(...pos(p,p.ngl),...pos(p,cur(p)))}});const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(la,3));g.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:css('--muted'),transparent:true,opacity:.4})))}
  if(show3==='design'){const rng=[Math.min(...ps.map(p=>p.dg)),Math.max(...ps.map(p=>p.dg))];g.add(cloud(p=>p.dg,p=>ramp((p.dg-rng[0])/Math.max(1e-6,rng[1]-rng[0])),sp*1.15))}
  const grid=new THREE.GridHelper(span*1.2,12,css('--line'),css('--line'));grid.position.y=-.5;g.add(grid);
  T3.g=g;T3.scene.add(g);place3();
}
function place3(){if(!T3.r)return;const d=T3.dist||100;T3.cam.position.set(Math.sin(T3.ry)*Math.cos(T3.rx)*d,Math.sin(T3.rx)*d,Math.cos(T3.ry)*Math.cos(T3.rx)*d);T3.cam.lookAt(0,0,0);T3.r.render(T3.scene,T3.cam)}

    <div class="ur" style="margin-bottom:8px">Excel se copy karke paste karein ya CSV file chunein. Header row ho to bhi theek hai.</div>
    <textarea id="iTx" placeholder="5197,666483.133,2762534.520,637.223,637.242,Phase 1,M4P1-003"></textarea>
    <div class="row" style="margin-top:8px"><input type="file" id="iF" accept=".csv,.txt"></div>
    <div class="row" style="margin-top:8px"><button class="btn pri" id="iAdd">Add / update points</button><button class="btn" id="iRep">Replace all points</button></div><div id="iBox"></div></div>
  <div class="card"><div class="ch"><h2>Import layer levels</h2><small>ID, RL, Date, WIR</small></div>
    <textarea id="lTx" style="min-height:80px" placeholder="5197,636.950,2026-10-27,WIR-0021"></textarea>
    <button class="btn pri" id="lAdd" style="margin-top:8px">Add layers</button></div>
  <div class="card"><div class="ch"><h2>Backup</h2></div>
    <div class="row"><button class="btn acc" id="bDl">Download backup</button><button class="btn" id="bCp">Copy backup</button><button class="btn" id="bCsv">Points CSV</button></div>
    <p class="small muted" style="margin:10px 0 6px">Restore: paste a backup or choose the file.</p>
    <textarea id="bTx" style="min-height:70px" placeholder='{"meta":{...},"points":[...]}'></textarea>
    <div class="row" style="margin-top:8px"><input type="file" id="bF" accept=".json,.txt"><button class="btn" id="bRs">Restore backup</button></div></div>
  <div class="card"><div class="ch"><h2>Reset</h2></div>
    <div class="row"><button class="btn" id="xS">Load sample data</button><button class="btn warn" id="xC">Clear all data</button></div><div id="xBox"></div></div>
  <div class="foot">Sara data isi phone par save hota hai (offline). Rozana backup download kar lein.<br>© ${new Date().getFullYear()} ${esc(m.eng)}</div>
  </div>`;
  $('sSave').onclick=()=>{const g=(id,d)=>{const v=parseFloat($(id).value);return v>0?v:d};
    Object.assign(m,{proj:$('sP').value.trim()||'Project',sub:$('sSub').value.trim(),eng:$('sE').value.trim()||'Eng Sheraz Abbasi',role:$('sR').value.trim()||'Survey Engineer',start:$('sSt').value,months:g('sMo',6),tol:g('sT',.03),lay:g('sL',.3),cell:g('sC',100),utm:Math.round(g('sU',38)),band:g('sB',6)});m.near=Math.max(g('sN',.1),m.tol);
    save();brand();toast('Settings saved');renderData()};
  const readF=(inp,ta)=>{$(inp).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$(ta).value=r.result;toast('File loaded')};r.readAsText(f)}};
  readF('iF','iTx');readF('bF','bTx');
  $('iAdd').onclick=()=>{const ps=parseCSV($('iTx').value);if(!ps.length){toast('No valid rows. Need ID, E, N, NGL, Design.');return}
    if(S.sample){S.points=[];S.wirs=[];S.checks=[];S.sample=false;m.proj='My Project';m.start=today()}
    let a=0,u=0;ps.forEach(p=>{const o=S.points.find(x=>x.id===p.id);if(o){Object.assign(o,{e:p.e,n:p.n,ngl:p.ngl,dg:p.dg,zone:p.zone||o.zone,area:p.area||o.area});u++}else{S.points.push(p);a++}});
    save();view.init=false;brand();toast(`${a} added, ${u} updated`);renderData()};
  $('iRep').onclick=()=>{const ps=parseCSV($('iTx').value);if(!ps.length){toast('No valid rows. Need ID, E, N, NGL, Design.');return}
    confirmBox($('iBox'),`Replace all ${S.points.length} points and their layers with ${ps.length} new points?`,'Replace',()=>{S.points=ps;if(S.sample){S.wirs=[];S.checks=[];m.proj='My Project';m.start=today()}S.sample=false;save();view.init=false;brand();toast(ps.length+' points loaded');renderData()})};
  $('lAdd').onclick=()=>{let n=0,miss=0;$('lTx').value.split(/\r?\n/).forEach(l=>{const c=l.split(/[,\t;]/).map(s=>s.trim());if(c.length<2)return;const p=S.points.find(x=>x.id===c[0]),rl=parseFloat(c[1]);if(!p||isNaN(rl)){if(c[0])miss++;return}p.layers.push({rl:+rl.toFixed(3),date:/^\d{4}-\d\d-\d\d$/.test(c[2]||'')?c[2]:today(),wir:c[3]||''});p.layers.sort((a,b)=>a.date.localeCompare(b.date));n++});save();toast(`${n} layers added${miss?`, ${miss} rows skipped`:''}`)};
  $('bDl').onclick=()=>download(`Backup_${slug()}_${today()}.json`,JSON.stringify(S),'application/json');
  $('bCp').onclick=()=>copy(JSON.stringify(S),'Backup');
  $('bCsv').onclick=()=>download(`Points_${slug()}_${today()}.csv`,pointsCSV(),'text/csv');
  $('bRs').onclick=()=>{try{const o=JSON.parse($('bTx').value);if(!o||!Array.isArray(o.points))throw 0;S.meta=Object.assign(S.meta,o.meta||{});S.points=o.points;S.wirs=o.wirs||[];S.checks=o.checks||[];S.sample=!!o.sample;save();view.init=false;brand();toast(`Restored ${S.points.length} points`);renderData()}catch(e){toast('That backup could not be read. Paste the full text.')}};
  $('xS').onclick=()=>{makeSample();M().proj='Sample Project';save();view.init=false;brand();toast('Sample data loaded');renderData()};
  $('xC').onclick=()=>confirmBox($('xBox'),`Delete all ${S.points.length} points, ${S.wirs.length} WIRs and every layer from this phone? Download a backup first.`,'Delete everything',()=>{S.points=[];S.wirs=[];S.checks=[];S.sample=false;save();brand();toast('All data cleared');renderData()});
}
function parseCSV(t){const o=[];t.split(/\r?\n/).forEach(l=>{const c=l.split(/[,\t;]/).map(s=>s.trim());if(c.length<5)return;const e=parseFloat(c[1]),n=parseFloat(c[2]),ngl=parseFloat(c[3]),dg=parseFloat(c[4]);if([e,n,ngl,dg].some(isNaN))return;o.push({id:c[0],e,n,ngl,dg,zone:c[5]||'',area:c[6]||'',layers:[]})});return o}
function pointsCSV(){
  const q=x=>/[,"\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x;
  const rows=[[M().proj],['Engineer: '+M().eng],['Date: '+today()],[],['Point','Easting','Northing','Phase','Area','NGL','Design','Current RL','Diff (m)','Status','Layers done','Layers needed','Layers left','Last date','Last WIR']];
  S.points.forEach(p=>{const l=p.layers[p.layers.length-1]||{};rows.push([p.id,p.e,p.n,p.zone,p.area,f3(p.ngl),f3(p.dg),f3(cur(p)),diff(p).toFixed(3),STAT[status(p)][0],p.layers.length,layersNeeded(p),layersLeft(p),l.date||'',l.wir||''])});
  rows.push([],['Layer record'],['Point','Layer','Date','RL','vs Design (m)','WIR']);
  S.points.forEach(p=>p.layers.forEach((l,i)=>rows.push([p.id,'L'+(i+1),l.date,f3(l.rl),(l.rl-p.dg).toFixed(3),l.wir||''])));
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Download started — if nothing happens, use Copy')}catch(e){toast('Download blocked here — use Copy')}}
function copy(text,label){const fb=()=>{const t=$('bTx')||$('rBox');if(t){t.value=text;t.focus();t.select()}toast('Selected — copy it manually')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(label+' copied'),fb);else fb()}

/* ================= boot ================= */
function brand(){
  $('engName').textContent=M().role;$('appName').innerHTML=esc(M().eng)+'<small>Earthworks QA · '+esc(M().proj)+'</small>';$('logo').alt=M().eng;
  fillFilters();
}
const mq=matchMedia('(prefers-color-scheme: dark)');const reTheme=()=>{if(curTab==='plan')drawPlan();if(curTab==='home')renderHome();if(curTab==='3d')build3()};
mq.addEventListener&&mq.addEventListener('change',reTheme);
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(!load()){makeSample();save()}
drawLogo();brand();renderHome();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawLogo();if(curTab==='home')drawGauge&&renderHome()});
})();
</script>
